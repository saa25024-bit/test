<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack - 食生活管理アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold fa-utensils text-2xl text-emerald-200"></i>
                <h1 class="text-xl font-bold tracking-wide">NutriTrack</h1>
            </div>
            <div id="authContainer" class="flex items-center space-x-3">
                <!-- Auth status dynamically rendered here -->
                <div class="animate-pulse flex space-x-2 items-center">
                    <div class="w-8 h-8 bg-emerald-500 rounded-full"></div>
                    <div class="h-4 w-20 bg-emerald-500 rounded"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6">
        
        <!-- Unauthenticated / Login View -->
        <div id="loggedOutView" class="hidden flex flex-col items-center justify-center py-16 text-center">
            <div class="bg-emerald-100 text-emerald-600 p-6 rounded-full mb-6 text-5xl">
                <i class="fa-solid fa-apple-whole"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-800 mb-4">毎日の食事をシンプルに管理</h2>
            <p class="text-slate-600 max-w-md mb-8">
                Googleアカウントでログインして、毎日のカロリーとPFC（タンパク質・脂質・炭水化物）バランスを記録・管理しましょう。
            </p>
            <button id="googleLoginBtn" class="flex items-center space-x-3 bg-white hover:bg-slate-100 text-slate-700 font-semibold py-3 px-6 rounded-xl border border-slate-300 shadow-md transition duration-200 transform hover:-translate-y-0.5">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Googleでサインイン</span>
            </button>
        </div>

        <!-- Authenticated Dashboard View -->
        <div id="loggedInView" class="hidden space-y-6">
            
            <!-- Controls & Date Selector -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center space-x-2">
                    <button id="prevDateBtn" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <input type="date" id="datePicker" class="font-semibold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button id="nextDateBtn" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button id="todayBtn" class="text-xs bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-semibold px-2.5 py-1.5 rounded-lg border border-emerald-200 transition">
                        今日
                    </button>
                </div>

                <!-- Tab Navigation -->
                <div class="flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto">
                    <button id="tabMeal" class="flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-sm font-medium transition bg-white text-slate-800 shadow-sm">
                        <i class="fa-solid fa-utensils mr-1"></i> 日別記録
                    </button>
                    <button id="tabStats" class="flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:text-slate-800">
                        <i class="fa-solid fa-chart-pie mr-1"></i> 統計・分析
                    </button>
                    <button id="tabGoals" class="flex-1 sm:flex-initial px-4 py-1.5 rounded-lg text-sm font-medium transition text-slate-600 hover:text-slate-800">
                        <i class="fa-solid fa-bullseye mr-1"></i> 目標設定
                    </button>
                </div>
            </div>

            <!-- TAB 1: Meal Log Tab -->
            <div id="contentMeal" class="space-y-6">
                <!-- Nutrition Progress Summary -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center text-slate-500 text-sm font-medium mb-1">
                            <span>総摂取カロリー</span>
                            <i class="fa-solid fa-fire text-amber-500"></i>
                        </div>
                        <div class="text-2xl font-bold text-slate-800" id="sumCalorie">0 <span class="text-xs text-slate-400 font-normal">/ <span id="goalCalorieDisplay">2000</span> kcal</span></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                            <div id="barCalorie" class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center text-slate-500 text-sm font-medium mb-1">
                            <span>タンパク質 (P)</span>
                            <i class="fa-solid fa-drumstick-bite text-rose-500"></i>
                        </div>
                        <div class="text-2xl font-bold text-slate-800" id="sumProtein">0 <span class="text-xs text-slate-400 font-normal">/ <span id="goalProteinDisplay">60</span> g</span></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                            <div id="barProtein" class="bg-rose-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center text-slate-500 text-sm font-medium mb-1">
                            <span>脂質 (F)</span>
                            <i class="fa-solid fa-cheese text-yellow-500"></i>
                        </div>
                        <div class="text-2xl font-bold text-slate-800" id="sumFat">0 <span class="text-xs text-slate-400 font-normal">/ <span id="goalFatDisplay">50</span> g</span></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                            <div id="barFat" class="bg-yellow-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center text-slate-500 text-sm font-medium mb-1">
                            <span>炭水化物 (C)</span>
                            <i class="fa-solid fa-wheat-awn text-blue-500"></i>
                        </div>
                        <div class="text-2xl font-bold text-slate-800" id="sumCarb">0 <span class="text-xs text-slate-400 font-normal">/ <span id="goalCarbDisplay">250</span> g</span></div>
                        <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                            <div id="barCarb" class="bg-blue-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Add Meal Button -->
                <div class="flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-700">食事の記録</h3>
                    <button id="openAddModalBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl shadow-sm transition flex items-center space-x-2 text-sm">
                        <i class="fa-solid fa-plus"></i>
                        <span>食事を追加</span>
                    </button>
                </div>

                <!-- Meals Categorized List -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Breakfast -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                            <h4 class="font-semibold text-slate-700 flex items-center space-x-2">
                                <i class="fa-solid fa-sun text-amber-500"></i>
                                <span>朝食</span>
                            </h4>
                            <span id="breakfastCalTotal" class="text-sm font-bold text-slate-500">0 kcal</span>
                        </div>
                        <div id="breakfastList" class="space-y-2">
                            <!-- Items inserted dynamically -->
                        </div>
                    </div>

                    <!-- Lunch -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                            <h4 class="font-semibold text-slate-700 flex items-center space-x-2">
                                <i class="fa-solid fa-cloud-sun text-orange-500"></i>
                                <span>昼食</span>
                            </h4>
                            <span id="lunchCalTotal" class="text-sm font-bold text-slate-500">0 kcal</span>
                        </div>
                        <div id="lunchList" class="space-y-2">
                            <!-- Items inserted dynamically -->
                        </div>
                    </div>

                    <!-- Dinner -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                            <h4 class="font-semibold text-slate-700 flex items-center space-x-2">
                                <i class="fa-solid fa-moon text-indigo-500"></i>
                                <span>夕食</span>
                            </h4>
                            <span id="dinnerCalTotal" class="text-sm font-bold text-slate-500">0 kcal</span>
                        </div>
                        <div id="dinnerList" class="space-y-2">
                            <!-- Items inserted dynamically -->
                        </div>
                    </div>

                    <!-- Snack -->
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                            <h4 class="font-semibold text-slate-700 flex items-center space-x-2">
                                <i class="fa-solid fa-cookie-bite text-pink-500"></i>
                                <span>間食</span>
                            </h4>
                            <span id="snackCalTotal" class="text-sm font-bold text-slate-500">0 kcal</span>
                        </div>
                        <div id="snackList" class="space-y-2">
                            <!-- Items inserted dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: Statistics Tab -->
            <div id="contentStats" class="hidden space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-700 mb-4 flex items-center space-x-2">
                            <i class="fa-solid fa-chart-line text-emerald-600"></i>
                            <span>直近7日間のカロリー推移</span>
                        </h3>
                        <div class="h-64 relative">
                            <canvas id="weeklyCalChart"></canvas>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="font-bold text-slate-700 mb-4 flex items-center space-x-2">
                            <i class="fa-solid fa-chart-pie text-emerald-600"></i>
                            <span>本日のPFCバランス</span>
                        </h3>
                        <div class="h-64 relative flex items-center justify-center">
                            <canvas id="pfcPieChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 3: Goals Setting Tab -->
            <div id="contentGoals" class="hidden max-w-xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                <h3 class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-sliders text-emerald-600"></i>
                    <span>1日の目標栄養素を設定</span>
                </h3>
                
                <form id="goalsForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">目標カロリー (kcal)</label>
                        <input type="number" id="goalCalorie" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">タンパク質 (g)</label>
                            <input type="number" id="goalProtein" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">脂質 (g)</label>
                            <input type="number" id="goalFat" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">炭水化物 (g)</label>
                            <input type="number" id="goalCarb" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-sm transition">
                        保存する
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- Meal Add/Edit Modal -->
    <div id="mealModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 space-y-4 transform transition-all">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">食事を追加</h3>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="mealForm" class="space-y-3">
                <input type="hidden" id="mealId">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">区分</label>
                    <select id="mealType" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-slate-700">
                        <option value="breakfast">朝食</option>
                        <option value="lunch">昼食</option>
                        <option value="dinner">夕食</option>
                        <option value="snack">間食</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">メニュー名 *</label>
                    <input type="text" id="mealName" placeholder="例: 鮭の塩焼き定食" required class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">カロリー (kcal)</label>
                        <input type="number" id="mealCalories" placeholder="500" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">タンパク質 (g)</label>
                        <input type="number" step="0.1" id="mealProtein" placeholder="25" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">脂質 (g)</label>
                        <input type="number" step="0.1" id="mealFat" placeholder="10" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">炭水化物 (g)</label>
                        <input type="number" step="0.1" id="mealCarbs" placeholder="60" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">メモ</label>
                    <input type="text" id="mealNotes" placeholder="ご飯少なめ、自作など" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="pt-2 flex justify-end space-x-2">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-50 transition text-sm">
                        キャンセル
                    </button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition text-sm shadow-sm">
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2 text-sm">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">操作が完了しました</span>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            doc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            setDoc, 
            getDoc 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB6J9iZjB0zw6PQVyW34De_XbAP4CQcsPE",
            authDomain: "task-53f0a.firebaseapp.com",
            projectId: "task-53f0a",
            storageBucket: "task-53f0a.firebasestorage.app",
            messagingSenderId: "1007010664935",
            appId: "1:1007010664935:web:14b7d6c43a9035a06ead42",
            measurementId: "G-GVFS6HXQF7"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // State Variables
        let currentUser = null;
        let selectedDate = new Date().toISOString().split('T')[0];
        let unsubscribeMealListener = null;
        let mealsData = [];
        let goals = { calories: 2000, protein: 60, fat: 50, carbs: 250 };

        // Chart Instances
        let weeklyChart = null;
        let pfcChart = null;

        // UI Element References
        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const authContainer = document.getElementById('authContainer');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const datePicker = document.getElementById('datePicker');

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            datePicker.value = selectedDate;
            setupEventListeners();
            initCharts();
        });

        // Authentication State Change Observer
        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            if (user) {
                renderAuthUser(user);
                loggedOutView.classList.add('hidden');
                loggedInView.classList.remove('hidden');
                
                // Fetch Goal settings
                await fetchGoals();
                // Attach real-time listener for current user's meals
                attachMealListener();
            } else {
                renderLoggedOut();
                loggedInView.classList.add('hidden');
                loggedOutView.classList.remove('hidden');
                if (unsubscribeMealListener) unsubscribeMealListener();
            }
        });

        function renderAuthUser(user) {
            authContainer.innerHTML = `
                <div class="flex items-center space-x-3">
                    <img src="${user.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full border border-emerald-300" alt="avatar">
                    <span class="text-sm font-medium hidden sm:inline">${user.displayName || 'ユーザー'}</span>
                    <button id="logoutBtn" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white px-3 py-1.5 rounded-lg transition">
                        ログアウト
                    </button>
                </div>
            `;
            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
        }

        function renderLoggedOut() {
            authContainer.innerHTML = `
                <span class="text-xs text-emerald-100">未ログイン</span>
            `;
        }

        // Login Handler
        googleLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
                showToast("ログインに成功しました", "success");
            } catch (err) {
                console.error("Auth Error:", err);
                showToast("ログインに失敗しました: " + err.message, "error");
            }
        });

        // Fetch User Goals
        async function fetchGoals() {
            if (!currentUser) return;
            try {
                const goalDocRef = doc(db, 'artifacts', 'meal-tracker', 'users', currentUser.uid, 'settings', 'goals');
                const snap = await getDoc(goalDocRef);
                if (snap.exists()) {
                    goals = { ...goals, ...snap.data() };
                }
                updateGoalUI();
            } catch (err) {
                console.error("Error fetching goals:", err);
            }
        }

        function updateGoalUI() {
            document.getElementById('goalCalorieDisplay').textContent = goals.calories;
            document.getElementById('goalProteinDisplay').textContent = goals.protein;
            document.getElementById('goalFatDisplay').textContent = goals.fat;
            document.getElementById('goalCarbDisplay').textContent = goals.carbs;

            document.getElementById('goalCalorie').value = goals.calories;
            document.getElementById('goalProtein').value = goals.protein;
            document.getElementById('goalFat').value = goals.fat;
            document.getElementById('goalCarb').value = goals.carbs;
        }

        // Realtime Listener for Meals
        function attachMealListener() {
            if (!currentUser) return;
            if (unsubscribeMealListener) unsubscribeMealListener();

            const mealsColRef = collection(db, 'artifacts', 'meal-tracker', 'users', currentUser.uid, 'meals');

            // Simplified collection query (rule compliance)
            unsubscribeMealListener = onSnapshot(mealsColRef, (snapshot) => {
                mealsData = [];
                snapshot.forEach(doc => {
                    mealsData.push({ id: doc.id, ...doc.data() });
                });
                renderMealLog();
                updateCharts();
            }, (err) => {
                console.error("Firestore Listen Error:", err);
                showToast("データの読み込みエラー", "error");
            });
        }

        // Render Meals for Selected Date
        function renderMealLog() {
            const dayMeals = mealsData.filter(m => m.date === selectedDate);

            const categories = { breakfast: [], lunch: [], dinner: [], snack: [] };
            let totalCal = 0, totalP = 0, totalF = 0, totalC = 0;

            dayMeals.forEach(meal => {
                if (categories[meal.type]) categories[meal.type].push(meal);
                totalCal += Number(meal.calories || 0);
                totalP += Number(meal.protein || 0);
                totalF += Number(meal.fat || 0);
                totalC += Number(meal.carbs || 0);
            });

            // Update Summary Cards
            document.getElementById('sumCalorie').childNodes[0].nodeValue = `${Math.round(totalCal)} `;
            document.getElementById('sumProtein').childNodes[0].nodeValue = `${Math.round(totalP * 10) / 10} `;
            document.getElementById('sumFat').childNodes[0].nodeValue = `${Math.round(totalF * 10) / 10} `;
            document.getElementById('sumCarb').childNodes[0].nodeValue = `${Math.round(totalC * 10) / 10} `;

            // Progress Bars
            document.getElementById('barCalorie').style.width = `${Math.min(100, (totalCal / goals.calories) * 100)}%`;
            document.getElementById('barProtein').style.width = `${Math.min(100, (totalP / goals.protein) * 100)}%`;
            document.getElementById('barFat').style.width = `${Math.min(100, (totalF / goals.fat) * 100)}%`;
            document.getElementById('barCarb').style.width = `${Math.min(100, (totalC / goals.carbs) * 100)}%`;

            // Render Category Items
            ['breakfast', 'lunch', 'dinner', 'snack'].forEach(type => {
                const listEl = document.getElementById(`${type}List`);
                const totalEl = document.getElementById(`${type}CalTotal`);
                const items = categories[type];

                const catCal = items.reduce((acc, curr) => acc + Number(curr.calories || 0), 0);
                totalEl.textContent = `${catCal} kcal`;

                if (items.length === 0) {
                    listEl.innerHTML = `<p class="text-xs text-slate-400 italic py-2">記録なし</p>`;
                    return;
                }

                listEl.innerHTML = items.map(item => `
                    <div class="flex items-center justify-between p-2.5 bg-slate-50 hover:bg-slate-100/80 rounded-xl transition group">
                        <div class="flex-1 pr-2">
                            <div class="font-medium text-slate-800 text-sm">${escapeHtml(item.name)}</div>
                            <div class="text-xs text-slate-500 flex space-x-2 mt-0.5">
                                <span>${item.calories || 0} kcal</span>
                                <span>P:${item.protein || 0}g</span>
                                <span>F:${item.fat || 0}g</span>
                                <span>C:${item.carbs || 0}g</span>
                            </div>
                            ${item.notes ? `<div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(item.notes)}</div>` : ''}
                        </div>
                        <div class="flex space-x-1 opacity-80 group-hover:opacity-100">
                            <button onclick="window.editMeal('${item.id}')" class="p-1.5 text-slate-400 hover:text-emerald-600 transition">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button onclick="window.deleteMeal('${item.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            });
        }

        // Helper escape HTML
        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Edit and Delete handlers attached to window
        window.editMeal = (id) => {
            const meal = mealsData.find(m => m.id === id);
            if (!meal) return;

            document.getElementById('mealId').value = meal.id;
            document.getElementById('mealType').value = meal.type;
            document.getElementById('mealName').value = meal.name;
            document.getElementById('mealCalories').value = meal.calories || '';
            document.getElementById('mealProtein').value = meal.protein || '';
            document.getElementById('mealFat').value = meal.fat || '';
            document.getElementById('mealCarbs').value = meal.carbs || '';
            document.getElementById('mealNotes').value = meal.notes || '';

            document.getElementById('modalTitle').textContent = '食事を編集';
            document.getElementById('mealModal').classList.remove('hidden');
        };

        window.deleteMeal = async (id) => {
            if (!confirm('この記録を削除しますか？')) return;
            try {
                const mealRef = doc(db, 'artifacts', 'meal-tracker', 'users', currentUser.uid, 'meals', id);
                await deleteDoc(mealRef);
                showToast("記録を削除しました", "success");
            } catch (err) {
                console.error("Delete error:", err);
                showToast("削除に失敗しました", "error");
            }
        };

        // Form Submit for Meals
        document.getElementById('mealForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const id = document.getElementById('mealId').value;
            const mealData = {
                date: selectedDate,
                type: document.getElementById('mealType').value,
                name: document.getElementById('mealName').value.trim(),
                calories: Number(document.getElementById('mealCalories').value) || 0,
                protein: Number(document.getElementById('mealProtein').value) || 0,
                fat: Number(document.getElementById('mealFat').value) || 0,
                carbs: Number(document.getElementById('mealCarbs').value) || 0,
                notes: document.getElementById('mealNotes').value.trim(),
                updatedAt: new Date()
            };

            try {
                if (id) {
                    const docRef = doc(db, 'artifacts', 'meal-tracker', 'users', currentUser.uid, 'meals', id);
                    await updateDoc(docRef, mealData);
                    showToast("更新しました", "success");
                } else {
                    const colRef = collection(db, 'artifacts', 'meal-tracker', 'users', currentUser.uid, 'meals');
                    await addDoc(colRef, mealData);
                    showToast("追加しました", "success");
                }
                closeMealModal();
            } catch (err) {
                console.error("Save meal error:", err);
                showToast("保存に失敗しました", "error");
            }
        });

        // Goals Form Submit
        document.getElementById('goalsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const newGoals = {
                calories: Number(document.getElementById('goalCalorie').value) || 2000,
                protein: Number(document.getElementById('goalProtein').value) || 60,
                fat: Number(document.getElementById('goalFat').value) || 50,
                carbs: Number(document.getElementById('goalCarb').value) || 250
            };

            try {
                const goalDocRef = doc(db, 'artifacts', 'meal-tracker', 'users', currentUser.uid, 'settings', 'goals');
                await setDoc(goalDocRef, newGoals);
                goals = newGoals;
                updateGoalUI();
                renderMealLog();
                showToast("目標設定を更新しました", "success");
            } catch (err) {
                console.error("Goals update error:", err);
                showToast("目標更新に失敗しました", "error");
            }
        });

        // Initialize Chart.js
        function initCharts() {
            const weeklyCtx = document.getElementById('weeklyCalChart').getContext('2d');
            weeklyChart = new Chart(weeklyCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: '摂取カロリー (kcal)',
                        data: [],
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#059669'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            const pfcCtx = document.getElementById('pfcPieChart').getContext('2d');
            pfcChart = new Chart(pfcCtx, {
                type: 'doughnut',
                data: {
                    labels: ['タンパク質 (g)', '脂質 (g)', '炭水化物 (g)'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#f43f5e', '#eab308', '#3b82f6']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // Update Charts Data
        function updateCharts() {
            if (!weeklyChart || !pfcChart) return;

            // 1. Weekly Calorie Chart (Last 7 days relative to selectedDate)
            const dates = [];
            const calories = [];
            const curr = new Date(selectedDate);

            for (let i = 6; i >= 0; i--) {
                const d = new Date(curr);
                d.setDate(d.getDate() - i);
                const dStr = d.toISOString().split('T')[0];
                dates.push(dStr.slice(5)); // MM-DD

                const dayCal = mealsData
                    .filter(m => m.date === dStr)
                    .reduce((sum, m) => sum + Number(m.calories || 0), 0);
                calories.push(dayCal);
            }

            weeklyChart.data.labels = dates;
            weeklyChart.data.datasets[0].data = calories;
            weeklyChart.update();

            // 2. PFC Balance Doughnut Chart for Current Selected Date
            const dayMeals = mealsData.filter(m => m.date === selectedDate);
            const pSum = dayMeals.reduce((sum, m) => sum + Number(m.protein || 0), 0);
            const fSum = dayMeals.reduce((sum, m) => sum + Number(m.fat || 0), 0);
            const cSum = dayMeals.reduce((sum, m) => sum + Number(m.carbs || 0), 0);

            pfcChart.data.datasets[0].data = [pSum, fSum, cSum];
            pfcChart.update();
        }

        // Setup Date & UI Control Listeners
        function setupEventListeners() {
            // Date Picker change
            datePicker.addEventListener('change', (e) => {
                selectedDate = e.target.value;
                renderMealLog();
                updateCharts();
            });

            document.getElementById('prevDateBtn').addEventListener('click', () => {
                const d = new Date(selectedDate);
                d.setDate(d.getDate() - 1);
                selectedDate = d.toISOString().split('T')[0];
                datePicker.value = selectedDate;
                renderMealLog();
                updateCharts();
            });

            document.getElementById('nextDateBtn').addEventListener('click', () => {
                const d = new Date(selectedDate);
                d.setDate(d.getDate() + 1);
                selectedDate = d.toISOString().split('T')[0];
                datePicker.value = selectedDate;
                renderMealLog();
                updateCharts();
            });

            document.getElementById('todayBtn').addEventListener('click', () => {
                selectedDate = new Date().toISOString().split('T')[0];
                datePicker.value = selectedDate;
                renderMealLog();
                updateCharts();
            });

            // Tabs
            const tabMeal = document.getElementById('tabMeal');
            const tabStats = document.getElementById('tabStats');
            const tabGoals = document.getElementById('tabGoals');

            const contentMeal = document.getElementById('contentMeal');
            const contentStats = document.getElementById('contentStats');
            const contentGoals = document.getElementById('contentGoals');

            function switchTab(activeTab, activeContent) {
                [tabMeal, tabStats, tabGoals].forEach(t => {
                    t.classList.remove('bg-white', 'text-slate-800', 'shadow-sm');
                    t.classList.add('text-slate-600');
                });
                [contentMeal, contentStats, contentGoals].forEach(c => c.classList.add('hidden'));

                activeTab.classList.add('bg-white', 'text-slate-800', 'shadow-sm');
                activeTab.classList.remove('text-slate-600');
                activeContent.classList.remove('hidden');
            }

            tabMeal.addEventListener('click', () => switchTab(tabMeal, contentMeal));
            tabStats.addEventListener('click', () => {
                switchTab(tabStats, contentStats);
                updateCharts();
            });
            tabGoals.addEventListener('click', () => switchTab(tabGoals, contentGoals));

            // Modal Controls
            document.getElementById('openAddModalBtn').addEventListener('click', () => {
                document.getElementById('mealForm').reset();
                document.getElementById('mealId').value = '';
                document.getElementById('modalTitle').textContent = '食事を追加';
                document.getElementById('mealModal').classList.remove('hidden');
            });

            document.getElementById('closeModalBtn').addEventListener('click', closeMealModal);
            document.getElementById('cancelModalBtn').addEventListener('click', closeMealModal);
        }

        function closeMealModal() {
            document.getElementById('mealModal').classList.add('hidden');
        }

        // Toast Helper
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = msg;
            if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
